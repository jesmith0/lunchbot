name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for merge conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)( |$)' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Merge conflict markers found"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run --locked ruff check --output-format=github .

      - name: Ruff format
        run: uv run --locked ruff format --check .

      - name: Mypy
        run: uv run --locked mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Compile all Python sources
        run: uv run --locked python -m py_compile lunchbot.py backend.py disable_veto.py lunchbot.wsgi

      - name: Run tests
        run: uv run --locked pytest -v
